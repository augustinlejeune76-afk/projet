
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commande servo micro:bit</title>

<style>
:root {
  color-scheme: dark;
  font-family: Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  color: white;
  background: radial-gradient(circle at top, #1e3a5f, #0b1220 65%);
}
main {
  width: min(100%, 480px);
  padding: 25px;
  border-radius: 20px;
  background: #111c2d;
  text-align: center;
}
h1 { margin-top: 0; }
button {
  border: 0;
  border-radius: 12px;
  padding: 15px 20px;
  color: white;
  font-size: 18px;
  font-weight: bold;
  background: #2563eb;
  cursor: pointer;
}
button:disabled {
  opacity: .4;
  cursor: not-allowed;
}
#disconnectBtn { background: #9f1239; }
#leftBtn, #rightBtn {
  width: 110px;
  height: 75px;
  font-size: 30px;
}
#leftBtn { background: #2563eb; }
#rightBtn { background: #16a34a; }
#value {
  font-size: 75px;
  font-weight: bold;
  margin: 25px 0 5px;
}
#servoValue {
  color: #93c5fd;
  margin-bottom: 25px;
}
.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin: 25px 0;
}
.connect {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
#message {
  min-height: 25px;
  color: #fbbf24;
  margin-top: 20px;
}
.note {
  color: #94a3b8;
  font-size: 13px;
}
</style>
</head>

<body>
<main>
  <h1>Commande du servo</h1>

  <p>Connecte ta micro:bit pour commencer.</p>

  <div class="connect">
    <button id="connectBtn">Connecter</button>
    <button id="disconnectBtn" disabled>Déconnecter</button>
  </div>

  <p id="status">Non connecté</p>

  <div id="value">0</div>
  <div id="servoValue">Servo : 90°</div>

  <div class="controls">
    <button id="leftBtn" disabled>◀</button>
    <button id="rightBtn" disabled>▶</button>
  </div>

  <p>Chaque clic déplace le servo de 5°.</p>

  <p id="message">Position initiale : 0</p>

  <p class="note">
    Gauche : diminuer. Droite : augmenter.
    Position limitée entre -90 et +90.
  </p>
</main>

<script>
const UART_SERVICE =
'6e400001-b5a3-f393-e0a9-e50e24dcca9e';

const UART_RX =
'6e400002-b5a3-f393-e0a9-e50e24dcca9e';

const connectBtn = document.getElementById('connectBtn');
const disconnectBtn = document.getElementById('disconnectBtn');
const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');
const valueDisplay = document.getElementById('value');
const servoDisplay = document.getElementById('servoValue');
const status = document.getElementById('status');
const message = document.getElementById('message');

let device = null;
let txCharacteristic = null;
let position = 0;

function updateDisplay() {
  valueDisplay.textContent =
    position > 0 ? "+" + position : position;

  const servoAngle = position + 90;
  servoDisplay.textContent = "Servo : " + servoAngle + "°";

  leftBtn.disabled = !txCharacteristic || position <= -90;
  rightBtn.disabled = !txCharacteristic || position >= 90;
}


async function sendPosition() {
  if (!txCharacteristic) return;

  const servoAngle = position + 90;
  const data = new TextEncoder().encode(servoAngle + "\n");

  try {
    if (txCharacteristic.properties.writeWithoutResponse) {
      await txCharacteristic.writeValueWithoutResponse(data);
    } else if (txCharacteristic.properties.write) {
      await txCharacteristic.writeValueWithResponse(data);
    } else {
      throw new Error(
        "Écriture impossible. write=" +
        txCharacteristic.properties.write +
        ", writeWithoutResponse=" +
        txCharacteristic.properties.writeWithoutResponse
      );
    }

    message.textContent = "Commande envoyée : " + position;
  } catch (error) {
    message.textContent = "Erreur Bluetooth : " + error.message;
  }
}

async function connect() {
  if (!navigator.bluetooth) {
    message.textContent = "Bluetooth indisponible. Utilise Chrome en HTTPS.";
    return;
  }

  try {
    message.textContent = "Recherche Bluetooth...";

    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [UART_SERVICE]
    });

    device.addEventListener(
      "gattserverdisconnected",
      disconnected
    );

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(UART_SERVICE);

    txCharacteristic =
      await service.getCharacteristic(UART_RX);

    position = 0;
    status.textContent = "Connecté à " + (device.name || "micro:bit");
    connectBtn.disabled = true;
    disconnectBtn.disabled = false;

    updateDisplay();
    await sendPosition();

  } catch (error) {
    txCharacteristic = null;
    status.textContent = "Non connecté";
    updateDisplay();
    message.textContent = "Connexion impossible : " + error.message;
  }
}

function disconnected() {
  txCharacteristic = null;
  status.textContent = "Non connecté";
  connectBtn.disabled = false;
  disconnectBtn.disabled = true;
  updateDisplay();
  message.textContent = "Micro:bit déconnectée.";
}

function disconnect() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect();
  }
  disconnected();
}

leftBtn.addEventListener("click", async () => {
  if (position > -90) {
    position -= 5;
    updateDisplay();
    await sendPosition();
  }
});

rightBtn.addEventListener("click", async () => {
  if (position < 90) {
    position += 5;
    updateDisplay();
    await sendPosition();
  }
});

connectBtn.addEventListener("click", connect);
disconnectBtn.addEventListener("click", disconnect);

updateDisplay();
</script>
</body>
</html>
